<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio Admin</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio.css') }}">

</head>
<body>
    {% include 'header.html' %}

    <div class="content">
        <h2>Bienvenido al Panel de Administración</h2>
        <p>Hola, {{ current_user.nombre }} {{ current_user.apellido }}. Estás logueado como administrador.</p>

        <div class="menu">
            <a href="{{ url_for('main.crear_funcionario') }}" class="inicioButton">Crear Funcionario</a>
            <a href="{{ url_for('main.admin_usuarios') }}" class="inicioButton">Ver Usuarios</a>
            <a href="{{ url_for('main.ver_eventos') }}" class="inicioButton">Ver Eventos</a>
            <a href="{{ url_for('main.lista_objetos') }}" class="inicioButton">Inventario</a>
            <a href="{{ url_for('main.escanear_qr') }}" class="inicioButton">Escanear Código QR</a>
            <a href="{{ url_for('main.listar_djs') }}" class="inicioButton">Ver DJs</a>
            <a href="{{ url_for('main.calendario') }}" class="inicioButton">Calendario</a>
            <a href="{{ url_for('main.lista_logs') }}" class="inicioButton">Registros</a>
            
        </div>
    </div>

    <footer class="footer">
        <!-- Puedes agregar información adicional en el pie de página si lo deseas -->
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
